<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; height: 100%; }
  body { font-family: "Segoe UI Variable Text", "Segoe UI", Arial, sans-serif; color: #fff;
         text-shadow: 0 1px 2px #000, 0 0 4px rgba(0,0,0,.75); user-select: none; }
  #score { position: relative; display: flex; align-items: flex-start; justify-content: center; gap: 1.2vw;
           padding-bottom: .35vw;
           background:
             radial-gradient(120% 110% at 50% 0%, rgba(255,255,255,.08), rgba(255,255,255,0) 55%),
             radial-gradient(140% 130% at 50% 115%, rgba(212,175,55,.06), rgba(212,175,55,0) 60%),
             linear-gradient(to right, rgba(0,0,0,0), rgba(6,8,13,0.87) 22%, rgba(6,8,13,0.87) 78%, rgba(0,0,0,0));
           filter: drop-shadow(0 .3vw .8vw rgba(0,0,0,.35));
           animation: panel-in .55s cubic-bezier(.22,1,.36,1) backwards; }
  @keyframes panel-in { from { opacity: 0; transform: translateY(-18%); } }
  /* gold hairlines framing the bar, fading out with the panel; a sheen drifts along each line */
  #score::before, #score::after { content: ""; position: absolute; left: 18%; right: 18%; height: 1px; pointer-events: none;
           background:
             linear-gradient(to right, transparent, rgba(255,244,205,.9), transparent) no-repeat -30% 0 / 22% 100%,
             linear-gradient(to right, transparent, rgba(222,186,88,.6) 30%, rgba(222,186,88,.6) 70%, transparent);
           box-shadow: 0 0 3px rgba(212,175,55,.25);
           animation: line-sheen 7s ease-in-out infinite; }
  #score::before { top: 0; animation-delay: 1.2s; }
  #score::after { bottom: 0; animation-delay: 2.1s; }
  @keyframes line-sheen { 0% { background-position: -30% 0, 0 0; } 40%, 100% { background-position: 130% 0, 0 0; } }
  #map { font-size: 1.45vw; font-weight: 800; padding-top: .45vw; min-width: 9vw; text-align: center;
         text-transform: uppercase; letter-spacing: .12em; text-shadow: none;
         background: linear-gradient(180deg, #fff6cf 15%, #ecc75d 55%, #c79a2e);
         -webkit-background-clip: text; -webkit-text-fill-color: transparent;
         filter: drop-shadow(0 1px 1px rgba(0,0,0,.9)) drop-shadow(0 0 7px rgba(0,0,0,.6));
         animation: map-glow 5s ease-in-out infinite; }
  @keyframes map-glow {
    0%, 100% { filter: drop-shadow(0 1px 1px rgba(0,0,0,.9)) drop-shadow(0 0 7px rgba(0,0,0,.6)); }
    50% { filter: drop-shadow(0 1px 1px rgba(0,0,0,.9)) drop-shadow(0 0 9px rgba(231,192,89,.4)); } }
  #map::after { content: ""; display: block; margin: .32vw auto 0; width: 70%; height: .2vw;
         background:
           radial-gradient(circle at 50% 50%, rgba(255,233,160,.95) 0 .07vw, rgba(255,233,160,0) .14vw),
           radial-gradient(circle at 7% 50%, rgba(255,233,160,.8) 0 .045vw, rgba(255,233,160,0) .1vw),
           radial-gradient(circle at 93% 50%, rgba(255,233,160,.8) 0 .045vw, rgba(255,233,160,0) .1vw),
           linear-gradient(to right, transparent, rgba(212,175,55,.7) 30%, rgba(212,175,55,.7) 70%, transparent) center/100% 1px no-repeat; }
  table { border-collapse: separate; border-spacing: 0 .22vw; font-size: 1.2vw; margin-top: .3vw; }
  td { padding: .06vw .5vw; white-space: nowrap; vertical-align: middle; }
  #team1 td { text-align: right; }
  #team2 td { text-align: left; }
  /* rows ease in when match data lands */
  @keyframes row-in { from { opacity: 0; transform: translateX(var(--slide)); } to { opacity: 1; transform: none; } }
  tr { animation: row-in .45s ease-out backwards; }
  tr:nth-child(2) { animation-delay: .06s; }
  tr:nth-child(3) { animation-delay: .12s; }
  tr:nth-child(n+4) { animation-delay: .18s; }
  #team1 tr { --slide: 1.4vw; }
  #team2 tr { --slide: -1.4vw; }
  .flag { height: 1.7vw; width: 2.7vw; object-fit: cover; vertical-align: middle; border-radius: .25vw;
          box-shadow: 0 0 0 1px rgba(230,198,100,.6), 0 .15vw .45vw rgba(0,0,0,.75);
          filter: saturate(1.08) contrast(1.04); }
  .rating { color: #a6d0ff; font-weight: 700; font-variant-numeric: tabular-nums;
            background: linear-gradient(180deg, rgba(122,182,255,.2), rgba(122,182,255,.08));
            border-radius: .8vw; padding: .02vw .55vw; text-shadow: 0 1px 2px rgba(0,0,0,.6);
            box-shadow: inset 0 0 0 1px rgba(122,182,255,.28), inset 0 1px 0 rgba(255,255,255,.12); }
  .winrate { color: #fff7a1; font-variant-numeric: tabular-nums; }
  .wins { color: #5cd32f; font-weight: 600; font-variant-numeric: tabular-nums; }
  .losses { color: #ff7066; font-weight: 600; font-variant-numeric: tabular-nums; }
  .civstat { color: var(--civstat, #bc8aea); font-variant-numeric: tabular-nums; }
  .name { font-weight: 700; letter-spacing: .022em; max-width: 11vw; overflow: hidden; text-overflow: ellipsis;
          text-shadow: none;
          background: linear-gradient(180deg, #fff 30%, #c4d2e3);
          -webkit-background-clip: text; -webkit-text-fill-color: transparent;
          filter: drop-shadow(0 1px 1px rgba(0,0,0,.85)); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  /* Edit mode */
  body.edit { outline: 3px dashed #ffb300; outline-offset: -3px; background: rgba(0,0,0,0.4); }
  #edit-hint { display: none; position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
               background: linear-gradient(180deg, #ffc845, #e09b00); color: #1a1200; font-weight: 600;
               font-size: 12px; padding: 3px 12px; border-radius: 12px; z-index: 10; white-space: nowrap;
               text-shadow: none; box-shadow: 0 2px 8px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.4); }
  body.edit #edit-hint { display: block; }
</style>
</head>
<body>
  <div id="edit-hint" data-tauri-drag-region>Drag to move · drag edges to resize — click "Done repositioning" in the control panel</div>
  <div id="score" style="visibility:hidden" data-tauri-drag-region>
    <table id="team1"></table>
    <div id="map" data-tauri-drag-region></div>
    <table id="team2"></table>
  </div>

<script>
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;
let settings = null;
let lastData = null;

function teamColor(team) {
  const colors = settings?.team_colors?.length
    ? settings.team_colors
    : [[74, 255, 2, 0.35], [3, 179, 255, 0.35], [255, 0, 0, 0.35]];
  const c = colors[(team - 1) % colors.length];
  return `rgba(${c[0]},${c[1]},${c[2]},${c[3]})`;
}

function applyStyle() {
  if (!settings) return;
  document.documentElement.style.setProperty('--civstat', settings.civ_stats_color || '#bc8aea');
  document.body.style.fontSize = (settings.font_scale || 100) + '%';
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function flagImg(civ) {
  return `<img class="flag" src="flags/${esc(civ)}.webp" onerror="this.style.display='none'">`;
}

function playerRow(p, right) {
  // Right team mirrors the column order
  const cells = [
    `<td>${flagImg(p.civ)}</td>`,
    `<td class="name">${esc(p.name ?? '?')}</td>`,
    `<td class="rating">${esc(p.rating)}</td>`,
    `<td class="winrate">${esc(p.winrate)}</td>`,
    `<td><span class="wins">${esc(p.wins)}</span>/<span class="losses">${esc(p.losses)}</span></td>`,
    `<td class="civstat">${p.civ_winrate ? esc(p.civ_winrate) + ' (' + esc(p.civ_games) + ')' : ''}</td>`,
  ];
  if (right) cells.reverse();
  const dir = right ? 'right' : 'left';
  const c = teamColor(p.team);
  return `<tr style="background: linear-gradient(to ${dir}, rgba(0,0,0,0), ${c})">${cells.join('')}</tr>`;
}

function render(d) {
  if (!d || !d.players) return;
  lastData = d;
  document.getElementById('score').style.visibility = 'visible';
  document.getElementById('map').textContent = d.map ?? '';
  const t1 = d.players.filter(p => p.team === 1);
  const t2 = d.players.filter(p => p.team !== 1);
  document.getElementById('team1').innerHTML = t1.map(p => playerRow(p, true)).join('');
  document.getElementById('team2').innerHTML = t2.map(p => playerRow(p, false)).join('');
}

listen('game_data', e => render(e.payload));
listen('edit_mode', e => {
  if (e.payload.window === 'overlay') document.body.classList.toggle('edit', !!e.payload.edit);
});
listen('settings_changed', e => { settings = e.payload; applyStyle(); if (lastData) render(lastData); });
invoke('get_settings').then(s => { settings = s; applyStyle(); });
invoke('get_current_data').then(d => { if (d) render(d); });
</script>
</body>
</html>
