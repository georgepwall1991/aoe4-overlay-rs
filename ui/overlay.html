<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; height: 100%; }
  body { font-family: "Segoe UI", Arial, sans-serif; color: #fff;
         text-shadow: 0 0 3px #000, 0 0 3px #000; user-select: none; }
  #score { display: flex; height: 100%; align-items: flex-start; justify-content: center; gap: 10px;
           background: linear-gradient(to right, rgba(0,0,0,0), rgba(0,0,0,0.85) 30%, rgba(0,0,0,0.85) 70%, rgba(0,0,0,0)); }
  #map { font-size: 1.5vw; font-weight: 600; padding-top: 6px; min-width: 9vw; text-align: center; color: #ffd; }
  table { border-collapse: collapse; font-size: 1.1vw; }
  td { padding: 1px 6px; white-space: nowrap; }
  #team1 td { text-align: right; }
  #team2 td { text-align: left; }
  .flag { height: 1.6vw; vertical-align: middle; border-radius: 2px; }
  .rating { color: #7ab6ff; }
  .winrate { color: #fffb78; }
  .wins { color: #48bd21; }
  .losses { color: #ff6060; }
  .civstat { color: var(--civstat, #bc8aea); }
  .name { font-weight: 600; max-width: 11vw; overflow: hidden; text-overflow: ellipsis; }
  /* Edit mode */
  body.edit { outline: 3px dashed #ffb300; outline-offset: -3px; background: rgba(0,0,0,0.4); }
  #edit-hint { display: none; position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
               background: #ffb300; color: #000; font-size: 12px; padding: 2px 10px; border-radius: 4px; z-index: 10; }
  body.edit #edit-hint { display: block; }
</style>
</head>
<body>
  <div id="edit-hint" data-tauri-drag-region>Drag to move — click "Done repositioning" in the control panel</div>
  <div id="score" data-tauri-drag-region>
    <table id="team1"></table>
    <div id="map" data-tauri-drag-region></div>
    <table id="team2"></table>
  </div>

<script>
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;
let settings = null;
let lastData = null;

function teamColor(team) {
  const colors = settings?.team_colors?.length
    ? settings.team_colors
    : [[74, 255, 2, 0.35], [3, 179, 255, 0.35], [255, 0, 0, 0.35]];
  const c = colors[(team - 1) % colors.length];
  return `rgba(${c[0]},${c[1]},${c[2]},${c[3]})`;
}

function applyStyle() {
  if (!settings) return;
  document.documentElement.style.setProperty('--civstat', settings.civ_stats_color || '#bc8aea');
  document.body.style.fontSize = (settings.font_scale || 100) + '%';
}

function flagImg(civ) {
  return `<img class="flag" src="flags/${civ}.webp" onerror="this.style.display='none'">`;
}

function playerRow(p, right) {
  // Right team mirrors the column order
  const cells = [
    `<td>${flagImg(p.civ)}</td>`,
    `<td class="name">${p.name ?? '?'}</td>`,
    `<td class="rating">${p.rating}</td>`,
    `<td class="winrate">${p.winrate}</td>`,
    `<td><span class="wins">${p.wins}</span>/<span class="losses">${p.losses}</span></td>`,
    `<td class="civstat">${p.civ_winrate ? p.civ_winrate + ' (' + p.civ_games + ')' : ''}</td>`,
  ];
  if (right) cells.reverse();
  const dir = right ? 'right' : 'left';
  const c = teamColor(p.team);
  return `<tr style="background: linear-gradient(to ${dir}, rgba(0,0,0,0), ${c})">${cells.join('')}</tr>`;
}

function render(d) {
  if (!d || !d.players) return;
  lastData = d;
  document.getElementById('map').textContent = d.map ?? '';
  const t1 = d.players.filter(p => p.team === 1);
  const t2 = d.players.filter(p => p.team !== 1);
  document.getElementById('team1').innerHTML = t1.map(p => playerRow(p, true)).join('');
  document.getElementById('team2').innerHTML = t2.map(p => playerRow(p, false)).join('');
}

listen('game_data', e => render(e.payload));
listen('edit_mode', e => {
  if (e.payload.window === 'overlay') document.body.classList.toggle('edit', !!e.payload.edit);
});
listen('settings_changed', e => { settings = e.payload; applyStyle(); if (lastData) render(lastData); });
invoke('get_settings').then(s => { settings = s; applyStyle(); });
invoke('get_current_data').then(d => { if (d) render(d); });
</script>
</body>
</html>
