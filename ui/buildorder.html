<!DOCTYPE html>
<html lang="en">

<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; height: 100%; }
  body { font-family: "Segoe UI Variable Text", "Segoe UI", Arial, sans-serif; user-select: none; font-variant-numeric: tabular-nums; }
  #panel.bo-switch { animation: bo-switch .3s ease-out; }
  @keyframes bo-switch { from { opacity: 0; transform: scale(.985); } to { opacity: 1; transform: none; } }
  #panel { box-sizing: border-box; height: 100%; padding: 10px 14px 12px; border-radius: 10px;

  #panel::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;

// Try alternate extensions before giving up and showing the raw token as text.
function imgFallback(img, token) {
  const order = ['.webp', '.png', '.jpg'];
  const cur = img.src.slice(img.src.lastIndexOf('.'));
  const next = order[order.indexOf(cur) + 1];
  if (next) img.src = img.src.slice(0, img.src.lastIndexOf('.')) + next;
  else img.outerHTML = `<span>${esc(token)}</span>`;
}

function rgb(c) { return `rgb(${c[0]},${c[1]},${c[2]})`; }

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function escJsAttr(s) {
  return esc(String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\r/g, '\\r').replace(/\n/g, '\\n'));
}

function colorSetting(value, fallback) {
  return Array.isArray(value) && value.length >= 3 && value.slice(0, 3).every(v => Number.isFinite(Number(v)))
    ? value.slice(0, 3).map(v => Math.max(0, Math.min(255, Math.round(Number(v)))))
    : fallback;
}

function numberSetting(value, fallback, min, max) {
  const n = Number(value);
  return Number.isFinite(n) ? Math.max(min, Math.min(max, n)) : fallback;
}

function applyStyle() {
  if (!settings) return;
  const p = document.getElementById('panel');
  const [r, g, b] = colorSetting(settings.bo_color_background, [30, 30, 30]);
  const fontSize = numberSetting(settings.bo_font_size, 12, 6, 40);
  const opacity = numberSetting(settings.bo_opacity, 0.75, 0, 1);
  p.style.background = `rgba(${r},${g},${b},${Math.max(0, opacity - 0.04)})`;
  p.style.color = rgb(colorSetting(settings.bo_text_color, [255, 255, 255]));
  p.style.fontSize = fontSize + 'pt';
  document.body.style.setProperty('--imgh', Math.round(fontSize * 2) + 'px');
  document.getElementById('title').style.color = rgb(colorSetting(settings.bo_title_color, [255, 255, 255]));
  document.getElementById('title').style.display = settings.bo_show_title === false ? 'none' : '';
}

// Original @image@ token syntax: image path relative to img/build_order/
const ICON_ALIASES = {

const CIV_ALIASES = [

  "Order of the Dragon": 'Order Of The Dragon',
  "House of Lancaster": 'House of Lancaster',
  "Zhu Xi's Legacy": 'Zhu Xis Legacy'
};
function civKey(value) {
  return String(value || '').toLowerCase().replace(/[^a-z0-9]/g, '');
}
function normalizeCivName(value) {
  const cleaned = String(value || '').replace(/&nbsp;/g, ' ').replace(/<[^>]*>/g, '').trim();
  if (!cleaned) return '';
  const key = civKey(cleaned);
  const hit = CIV_ALIASES.find(([alias]) => civKey(alias) === key);
  return hit ? hit[1] : cleaned;
}
function splitCivs(value) {
  return String(value || '').replace(/[|;/]/g, ',').replace(/\s+and\s+/gi, ',')
    .split(',').map(normalizeCivName).filter(Boolean);
}
function normalizeCivilization(value) {
  if (Array.isArray(value)) {
    const civs = value.flatMap(splitCivs);
    return civs.length ? civs : null;
  }
  if (typeof value === 'string') {
    const civs = splitCivs(value);
    if (!civs.length) return null;
    return civs.length === 1 ? civs[0] : civs;
  }
  return null;
}
function flagName(civ) {
  const normalized = normalizeCivName(civ) || civ;
  return FLAG_ALIASES[normalized] || FLAG_ALIASES[civ] || normalized;
}
function isPlausibleLocalIconToken(token) {
  return String(token || '').includes('/') &&
    !/\s/.test(String(token || '')) &&
    /^[a-z0-9_./-]+$/i.test(String(token || ''));
}
function normalizeIconToken(token) {
  let clean = String(token).trim().replace(/['"<>]/g, '');
  if (!clean) return clean;
  const assetPath = clean.split(/[?#]/)[0].replace(/\\/g, '/');
  const assetLower = assetPath.toLowerCase();
  const marker = '/assets/pictures/';
  let assetToken = '';
  const markerAt = assetLower.indexOf(marker);
  if (markerAt >= 0) assetToken = assetPath.slice(markerAt + marker.length);
  else if (assetLower.startsWith('assets/pictures/')) assetToken = assetPath.slice('assets/pictures/'.length);
  if (assetToken && isPlausibleLocalIconToken(assetToken)) return assetToken.replace(/\.(webp|png|jpg|jpeg)$/i, '');
  const stem = clean.split(/[?#]/)[0].split('/').pop().toLowerCase().replace(/\.(webp|png|jpg|jpeg)$/i, '');
  if (ICON_ALIASES[stem]) return ICON_ALIASES[stem];
  if (/^https?:\/\//i.test(clean)) return clean;

    else if (c === '\\') escaped = true;
    else if (c === '"') break;
  }
  return { text: out, index: i };
}

function copyBalancedJsonValue(s, i) {
  const stack = [s[i] === '{' ? '}' : ']'];
  let out = '';
  let quote = null;
  let escaped = false;
  while (i < s.length) {
    const c = s[i++];
    out += c;
    if (quote) {
      if (escaped) escaped = false;
      else if (c === '\\') escaped = true;
      else if (c === '"') quote = null;
      continue;
    }
    if (c === '"') quote = c;
    else if (c === '{') stack.push('}');
    else if (c === '[') stack.push(']');
    else if ((c === '}' || c === ']') && stack[stack.length - 1] === c) {
      stack.pop();
      if (!stack.length) break;
    }
  }
  return { text: out, index: i };
}

function quoteBareItemsInArray(s, i) {
  let out = '';
  while (i < s.length) {
    const c = s[i];
    if (c === ']') return { text: out + c, index: i + 1 };
    if (/\s|,/.test(c)) {
      out += c;
      i++;
      continue;
    }
    if (c === '"') {
      const copied = copyQuotedJsonString(s, i);
      out += copied.text;
      i = copied.index;
      continue;
    }
    if (c === '{' || c === '[') {
      const copied = copyBalancedJsonValue(s, i);
      out += quoteKnownBareStringArrayValues(copied.text);
      i = copied.index;
      continue;
    }
    const valueStart = i;
    while (i < s.length && !/[,\]]/.test(s[i])) i++;
    const raw = s.slice(valueStart, i);
    const trailing = raw.match(/\s*$/)[0];
    const value = raw.slice(0, raw.length - trailing.length).trim();
    if (!value || bareJsonLiteralStarts(s, valueStart) || isJsonNumberLiteral(value)) out += raw;
    else out += JSON.stringify(value) + trailing;
  }
  return { text: out, index: i };
}

function quoteKnownBareStringValues(text) {
  const s = String(text || '');
  let out = '';
  let i = 0;
  let quote = null;
  let escaped = false;
  while (i < s.length) {
    const c = s[i];
    if (quote) {
      out += c;
      if (escaped) escaped = false;
      else if (c === '\\') escaped = true;
      else if (c === quote) quote = null;
      i++;
      continue;
    }
    if (c !== '"') {
      out += c;
      i++;
      continue;
    }
    const beforeKey = out;
    let keyToken = '"';
    let key = '';
    i++;
    let keyEscaped = false;
    while (i < s.length) {
      const kc = s[i];
      keyToken += kc;
      i++;
      if (keyEscaped) {
        key += kc;
        keyEscaped = false;
      } else if (kc === '\\') {
        keyEscaped = true;
      } else if (kc === '"') {
        break;
      } else {
        key += kc;
      }
    }
    out += keyToken;
    if (!BARE_STRING_VALUE_KEYS.has(key) || !/[{,]\s*$/.test(beforeKey)) continue;
    let j = i;
    while (j < s.length && /\s/.test(s[j])) j++;
    if (s[j] !== ':') continue;
    while (i <= j) out += s[i++];
    while (i < s.length && /\s/.test(s[i])) out += s[i++];
    if (i >= s.length || /["{\[]/.test(s[i]) || bareJsonLiteralStarts(s, i)) continue;
    const valueStart = i;
    while (i < s.length && !/[,}\];]/.test(s[i])) i++;
    const raw = s.slice(valueStart, i);
    const trailing = raw.match(/\s*$/)[0];
    const value = raw.slice(0, raw.length - trailing.length).trim();
    if (!value) {
      out += raw;
      continue;
    }
    out += JSON.stringify(value) + trailing;
  }
  return out;
}

function quoteKnownBareStringArrayValues(text) {
  const s = String(text || '');
  let out = '';
  let i = 0;
  let quote = null;
  let escaped = false;
  while (i < s.length) {
    const c = s[i];
    if (quote) {
      out += c;
      if (escaped) escaped = false;
      else if (c === '\\') escaped = true;
      else if (c === quote) quote = null;
      i++;
      continue;
    }
    if (c !== '"') {
      out += c;
      i++;
      continue;
    }
    const beforeKey = out;
    let keyToken = '"';
    let key = '';
    i++;
    let keyEscaped = false;
    while (i < s.length) {
      const kc = s[i];
      keyToken += kc;
      i++;
      if (keyEscaped) {
        key += kc;
        keyEscaped = false;
      } else if (kc === '\\') {
        keyEscaped = true;
      } else if (kc === '"') {
        break;
      } else {
        key += kc;
      }
    }
    out += keyToken;
    if (!BARE_STRING_ARRAY_KEYS.has(key) || !/[{,]\s*$/.test(beforeKey)) continue;
    let j = i;
    while (j < s.length && /\s/.test(s[j])) j++;
    if (s[j] !== ':') continue;
    while (i <= j) out += s[i++];
    while (i < s.length && /\s/.test(s[i])) out += s[i++];
    if (s[i] !== '[') continue;
    out += s[i++];
    const quoted = quoteBareItemsInArray(s, i);
    out += quoted.text;
    i = quoted.index;
  }
  return out;
}

function convertNonJsonLiterals(text) {
  const s = String(text || '');
  let out = '';
  let quote = null;
  let escaped = false;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (quote) {
      out += c;
      if (escaped) escaped = false;
      else if (c === '\\') escaped = true;
      else if (c === quote) quote = null;
      continue;
    }
    if (c === '"') {
      quote = c;
      out += c;
      continue;
    }
    if (/[A-Za-z+-]/.test(c)) {
      const start = i;
      if (c === '+' || c === '-') i++;
      while (i < s.length && /[A-Za-z0-9_]/.test(s[i])) i++;
      const word = s.slice(start, i);
      if (word === 'True') out += 'true';
      else if (word === 'False') out += 'false';
      else if (word === 'None' || word === 'undefined' || word === 'NaN' ||
        word === 'Infinity' || word === '+Infinity' || word === '-Infinity') out += 'null';
      else out += word;
      i--;
      continue;
    }
    out += c;
  }
  return out;
}

function repairJsonSyntax(text) {
  let fixed = extractJsonLike(stripJsonFence(text))
    .replace(/^\uFEFF/, '')
    .replace(/[“”]/g, '"');
  fixed = stripJsonComments(fixed);
  fixed = fixed.replace(/([{,]\s*)([A-Za-z_][A-Za-z0-9_]*)(\s*[:=])/g, '$1"$2"$3');
  fixed = normalizeJsonKeyEquals(fixed);
  fixed = convertSingleQuotedJsonStrings(fixed);
  fixed = quoteKnownBareStringValues(fixed);
  fixed = quoteKnownBareStringArrayValues(fixed);
  fixed = convertNonJsonLiterals(fixed);
  fixed = normalizeJsonSemicolons(fixed);
  fixed = insertMissingJsonCommas(fixed);
  fixed = fixed.replace(/([{,]\s*)([A-Za-z_][A-Za-z0-9_]*)(\s*[:=])/g, '$1"$2"$3');
  fixed = normalizeJsonKeyEquals(fixed);
  fixed = fixed.replace(/,\s*([}\]])/g, '$1');
  return fixed;
}

function parseBuildJsonContent(content) {
  const strict = extractJsonLike(stripJsonFence(content));
  const parseTextBuild = () => parsePipedBuildText(strict) || parseTsvBuildText(strict) || parseCsvBuildText(strict) || parseTimedBuildText(strict) || parsePlainBuildText(strict);
  if (!/^[{\[]/.test(strict)) {
    return parseTextBuild();
  }
  try {
    return normalizeBuildJson(JSON.parse(strict));
  } catch (e) {
    try {
      return normalizeBuildJson(JSON.parse(repairJsonSyntax(strict)));
    } catch (_) {
      return parseTextBuild();
    }
  }
}

function safeParseBuildJsonContent(content) {
  try {
    return parseBuildJsonContent(content);
  } catch (e) {
    console.warn('build order parse failed; falling back to plain text', e);
    return null;
  }
}

function hasStepSignal(step) {
  if (!step || typeof step !== 'object') return false;
  if ((step.notes || []).some(n => String(n || '').trim())) return true;
  if (timeForDisplay(step.time) || ageForDisplay(step.age) !== null || countForDisplay(step.villager_count) !== null || countForDisplay(step.population_count) !== null) return true;
  const r = step.resources || {};
  return ['food', 'wood', 'gold', 'stone'].some(k => (r[k] ?? -1) > 0) || (r.builder ?? -1) >= 0;
}

function resourceKeysForDisplay(resources) {
  const r = resources || {};
  const eco = ['food', 'wood', 'gold', 'stone'];
  const keys = eco.some(k => (r[k] ?? -1) > 0) ? eco.filter(k => (r[k] ?? -1) >= 0) : [];
  if ((r.builder ?? -1) >= 0) keys.push('builder');
  return keys;
}

function notesForDisplay(step, limit = Infinity) {
  const seen = new Set();
  const notes = [];
  for (const raw of step?.notes || []) {
    const note = String(raw || '').trim();
    if (!note) continue;
    const key = normalizeNoteValue(note).toLowerCase();
    if (seen.has(key)) continue;
    seen.add(key);
    notes.push(note);
    if (notes.length >= limit) break;
  }
  return notes;
}

function countForDisplay(value) {
  if (typeof value === 'number' && Number.isFinite(value)) return value >= 0 ? Math.trunc(value) : null;
  const m = String(value ?? '').trim().match(/^\d{1,3}/);
  return m ? Number(m[0]) : null;
}

function ageForDisplay(value) {
  const age = parseAgeish(value);
  return age >= 1 && age <= 4 ? age : null;
}

function timeForDisplay(value) {
  const fixed = normalizeTimeValue(value);
  return fixed && isNormalizedTimeValue(fixed) ? fixed : '';
}

function ageLabelForDisplay(age) {
  return { 1: 'Age I', 2: 'Age II', 3: 'Age III', 4: 'Age IV' }[age] || '';
}

function resourceLabelForDisplay(key) {
  return {
    food: 'Food villagers assigned',
    wood: 'Wood villagers assigned',
    gold: 'Gold villagers assigned',
    stone: 'Stone villagers assigned',
    builder: 'Builders',
    villager: 'Villager count',
    population: 'Population',
    time: 'Step time',
  }[key] || key;
}

function chipHtml(icon, value, label, className = 'res', detail = '') {
  const text = value === '' || value === null || value === undefined ? '' : String(value);
  const title = [text ? `Current ${label}: ${text}` : `Current ${label}`, detail].filter(Boolean).join(' - ');
  return `<span class="${esc(className)}" title="${esc(title)}"><img src="${esc(icon)}">${esc(text)}</span>`;
}

function deltaTitle(value, previous) {
  if (!(previous >= 0) || value === previous) return '';
  return value > previous ? `Increased from ${previous}` : `Decreased from ${previous}`;
}

function previewChipHtml(icon, value, label, className = '') {
  const text = value === '' || value === null || value === undefined ? '' : String(value);
  const title = text ? `Next ${label}: ${text}` : `Next ${label}`;
  return `<span class="${esc(['nx-chip', className].filter(Boolean).join(' '))}" title="${esc(title)}"><img src="${esc(icon)}">${esc(text)}</span>`;
}

function compactPreviewText(text, max = 90) {
  const oneLine = String(text || '').replace(/\s+/g, ' ').trim();
  return oneLine.length > max ? oneLine.slice(0, max - 1).trimEnd() + '…' : oneLine;
}

function stepPreviewHtml(step) {
  if (!step || typeof step !== 'object') return '';
  const bits = [];
  const time = timeForDisplay(step.time);
  if (time) bits.push(previewChipHtml(RES_ICONS.time, time, resourceLabelForDisplay('time'), 'nx-time'));
  const age = ageForDisplay(step.age);
  if (age !== null) bits.push(previewChipHtml(AGE_ICONS[age], ageLabelForDisplay(age), 'Age', 'nx-age'));
  const r = step.resources || {};
  for (const k of resourceKeysForDisplay(r)) {
    if ((r[k] ?? -1) >= 0) bits.push(previewChipHtml(RES_ICONS[k], r[k], resourceLabelForDisplay(k), `nx-${k}`));
  }
  const villagers = countForDisplay(step.villager_count);
  const population = countForDisplay(step.population_count);
  if (villagers !== null) bits.push(previewChipHtml(RES_ICONS.villager, villagers, resourceLabelForDisplay('villager'), 'nx-villager'));
  if (population !== null) bits.push(previewChipHtml(RES_ICONS.population, population, resourceLabelForDisplay('population'), 'nx-population'));
  const previewNotes = notesForDisplay(step);
  bits.push(...previewNotes.slice(0, 1).map(n => `<div class="nx-note" title="${esc(`Next instruction: ${compactPreviewText(n, 220)}`)}">${renderLine(compactPreviewText(n))}</div>`));
  const hiddenNotes = previewNotes.length - 1;
  if (hiddenNotes > 0) {
    const hiddenTitle = previewNotes.slice(1).map(n => compactPreviewText(n, 120)).join(' | ');
    bits.push(`<div class="nx-more" title="${esc(`Hidden next details: ${hiddenTitle}`)}">+${hiddenNotes} next detail${hiddenNotes === 1 ? '' : 's'}</div>`);
  }
  return bits.join('<span> · </span>');
}

function clampStepIndex(value, count) {
  const n = Number(value);
  const i = Number.isFinite(n) ? Math.trunc(n) : 0;
  return Math.min(Math.max(i, 0), Math.max(count - 1, 0));
}

function fallbackLineHtml(line) {
  const cleaned = normalizeNoteValue(stripNoteListMarker(line)).split('\n').filter(Boolean)[0];
  return renderLine(compactPreviewText(cleaned || String(line || '').trim(), 120));
}

function fallbackLineTitle(line) {
  return compactPreviewText(normalizeNoteValue(stripNoteListMarker(line)) || String(line || '').trim(), 220);
}

function buildNameForDisplay(build) {
  const name = String(build?.name || '').trim();
  return name || 'Build order';
}

function buildTitleTextHtml(name, title = name) {
  return `<span class="t" title="${esc(title)}">${esc(name)}</span>`;
}

function progressTitle(step, total) {
  if (!(total > 0)) return 'No build steps';
  const raw = total > 0 ? ((step + 1) / total) * 100 : 0;
  const pct = Number.isInteger(raw) ? String(raw) : raw.toFixed(1);
  return `Progress: step ${step + 1} of ${total} (${pct}%)`;
}

function stepCountTitle(step, total) {
  return `Current position - ${progressTitle(step, total)}`;
}

function nextTitle(step, total) {
  return `Upcoming step - ${progressTitle(step + 1, total)}`;
}

function hasVisibleTargets(step) {
  if (!step || typeof step !== 'object') return false;
  if (timeForDisplay(step.time) || ageForDisplay(step.age) !== null ||
      countForDisplay(step.villager_count) !== null || countForDisplay(step.population_count) !== null) return true;
  return resourceKeysForDisplay(step.resources).length > 0;
}

function targetSummaryTitle(step) {
  if (!step || typeof step !== 'object') return '';
  const parts = [];
  const time = timeForDisplay(step.time);
  if (time) parts.push(`Time ${time}`);
  const age = ageForDisplay(step.age);
  if (age !== null) parts.push(ageLabelForDisplay(age));
  const r = step.resources || {};
  for (const k of resourceKeysForDisplay(r)) {
    if ((r[k] ?? -1) >= 0) parts.push(`${resourceLabelForDisplay(k)} ${r[k]}`);
  }
  const villagers = countForDisplay(step.villager_count);
  const population = countForDisplay(step.population_count);
  if (villagers !== null) parts.push(`Villagers ${villagers}`);
  if (population !== null) parts.push(`Population ${population}`);
  return parts.length ? `Current step targets: ${parts.join(' | ')}` : 'No current step targets';
}

function stepNotesHtml(step) {
  const noteLines = notesForDisplay(step);
  if (!noteLines.length) {
    return hasVisibleTargets(step)
      ? `<div class="txt-cur" title="${esc(targetSummaryTitle(step))}">Follow the shown targets</div>`
      : `<div class="txt-cur" title="${esc(targetSummaryTitle(step))}">No note for this step</div>`;
  }
  const visible = noteLines.slice(0, 4);
  const more = noteLines.length - visible.length;
  const hiddenTitle = more > 0 ? `Hidden current details: ${noteLines.slice(4).map(n => compactPreviewText(n, 120)).join(' | ')}` : '';
  return visible.map((n, i) => {
    const label = i === 0 ? 'Current instruction' : 'Step detail';
    return `<div class="${i === 0 ? 'txt-cur' : 'txt-detail'}" title="${esc(`${label}: ${compactPreviewText(n, 220)}`)}">${renderLine(compactPreviewText(n, 140))}</div>`;
  }).join('') +
    (more > 0 ? `<div class="txt-more" title="${esc(hiddenTitle)}">+${more} current detail${more === 1 ? '' : 's'}</div>` : '');
}

function plainTextWindowHtml(lines, stepIdx, step) {
  const currentLine = stepIdx[step];
  const firstStep = Math.max(0, step - 2);
  const lastStep = Math.min(stepIdx.length - 1, step + 3);
  const firstLine = stepIdx[firstStep];
  const lastLine = stepIdx[lastStep];
  const parts = [];
  const context = progressTitle(step, stepIdx.length);
  if (firstStep > 0) parts.push(`<div class="txt-gap" title="Instructions 1-${firstStep} hidden before ${esc(context)}">+${firstStep} earlier</div>`);
  for (let i = firstLine; i <= lastLine; i++) {
    if (!String(lines[i] || '').trim()) continue;
    const isCurrent = i === currentLine;
    const label = isCurrent ? 'Current instruction' : i < currentLine ? 'Previous instruction' : 'Upcoming instruction';
    const rowClass = isCurrent ? 'txt-cur' : `txt-dim ${i < currentLine ? 'txt-prev' : 'txt-next'}`;
    parts.push(`<div class="${rowClass}" title="${esc(`${label}: ${fallbackLineTitle(lines[i])}`)}">${fallbackLineHtml(lines[i])}</div>`);
  }
  const hiddenLater = stepIdx.length - lastStep - 1;
  if (hiddenLater > 0) parts.push(`<div class="txt-gap" title="Instructions ${lastStep + 2}-${stepIdx.length} hidden after ${esc(context)}">+${hiddenLater} later</div>`);
  return parts.join('');
}

function restartStepAnimation(...els) {
  for (const el of els) {
    el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  }
}

function render() {
  const titleEl = document.getElementById('title');
  const resEl = document.getElementById('resources');
  const notesEl = document.getElementById('notes');
  const progEl = document.getElementById('progress');
  const nextEl = document.getElementById('next');
  titleEl.innerHTML = ''; resEl.innerHTML = ''; notesEl.innerHTML = '';
  progEl.style.display = 'none'; resEl.style.display = 'none'; nextEl.style.display = 'none';
  progEl.title = '';
  resEl.title = '';
  notesEl.title = '';
  nextEl.classList.remove('done');
  nextEl.title = '';
  if (!current) { titleEl.innerHTML = buildTitleTextHtml('No build order selected', 'Select a build order to show steps'); return; }
  const buildName = buildNameForDisplay(current);

  const bo = safeParseBuildJsonContent(current.content);

  if (bo && Array.isArray(bo.build_order)) {
    const steps = bo.build_order.filter(hasStepSignal);
    if (!steps.length) {
      titleEl.innerHTML = buildTitleTextHtml(buildName);
      notesEl.innerHTML = `<div class="txt-cur" title="${esc(`${buildName} has no parsed step targets or notes`)}">No usable build steps found</div>`;
      return;
    }
    const step = clampStepIndex(current.step, steps.length);
    const progress = progressTitle(step, steps.length);
    const s = steps[step];
    const civs = (Array.isArray(bo.civilization) ? bo.civilization : [bo.civilization]).filter(Boolean).slice(0, 3);
    titleEl.innerHTML =
      civs.map(c => {
        const f = flagName(c);
        return `<img src="flags/${esc(f)}.webp" title="${esc(`Civilization: ${c}`)}" onerror="this.style.display='none'">`;
      }).join('') +
      buildTitleTextHtml(buildName) +
      `<span id="step-count" title="${esc(stepCountTitle(step, steps.length))}">${step + 1}/${steps.length}</span>`;
    progEl.style.display = '';
    progEl.title = `Build order progress - ${progress}`;
    progEl.style.setProperty('--seg', steps.length > 40 ? '200%' : (100 / steps.length) + '%');
    progEl.firstElementChild.style.width = ((step + 1) / steps.length * 100) + '%';
    const r = s.resources || {};
    const pr = (steps[step - 1] || {}).resources || {};
    const prev = steps[step - 1] || {};
    const delta = (cur, old) => {
      if (step === 0 || !(old >= 0) || cur === old) return '';
      return cur > old ? ' up' : ' down';
    };
    const res = [];
    const time = timeForDisplay(s.time);
    if (time)
      res.push(chipHtml(RES_ICONS.time, time, resourceLabelForDisplay('time'), 'res time'));
    const age = ageForDisplay(s.age);
    const prevAge = ageForDisplay(prev.age);
    if (age !== null) {
      const ageUp = step > 0 && prevAge !== null && age > prevAge;
      res.push(chipHtml(AGE_ICONS[age], ageUp ? 'Age up!' : ageLabelForDisplay(age), 'Age', `res age${ageUp ? ' age-up' : ''}`, ageUp ? `Advanced from ${ageLabelForDisplay(prevAge)}` : ''));
    }
    for (const k of resourceKeysForDisplay(r)) {
      if ((r[k] ?? -1) >= 0)
        res.push(chipHtml(RES_ICONS[k], r[k], resourceLabelForDisplay(k), `res ${k}${delta(r[k], pr[k])}`, deltaTitle(r[k], pr[k])));
    }
    const villagers = countForDisplay(s.villager_count);
    const prevVillagers = countForDisplay(prev.villager_count);
    const population = countForDisplay(s.population_count);
    const prevPopulation = countForDisplay(prev.population_count);
    if (villagers !== null)
      res.push(chipHtml(RES_ICONS.villager, villagers, resourceLabelForDisplay('villager'), `res villager${delta(villagers, prevVillagers)}`, deltaTitle(villagers, prevVillagers)));
    if (population !== null)
      res.push(chipHtml(RES_ICONS.population, population, resourceLabelForDisplay('population'), `res population${delta(population, prevPopulation)}`, deltaTitle(population, prevPopulation)));
    resEl.innerHTML = res.join('');
    resEl.style.display = res.length ? '' : 'none';
    resEl.title = targetSummaryTitle(s);
    notesEl.title = `Current step - ${progress}`;
    notesEl.innerHTML = stepNotesHtml(s);
    const nx = steps[step + 1];
    const nxPreview = stepPreviewHtml(nx);
    if ((settings?.bo_show_next ?? true) && nxPreview) {
      nextEl.style.display = '';
      nextEl.classList.remove('done');
      nextEl.title = nextTitle(step, steps.length);
      nextEl.innerHTML = `<span class="nx-label">Next</span>${nxPreview}`;
    } else if ((settings?.bo_show_next ?? true) && step === steps.length - 1) {
      nextEl.style.display = '';
      nextEl.classList.add('done');
      nextEl.title = `Build order complete - ${progress}`;
      nextEl.innerHTML = '<span class="nx-label">Done</span><div class="nx-done">Final step</div>';
    }
    restartStepAnimation(resEl, notesEl, nextEl);
  } else {
    // Plain TXT build order: each non-empty line is a step, tracked by current.step
    const lines = String(current.content || '').split('\n');
    const stepIdx = lines.reduce((a, l, i) => (l.trim() ? [...a, i] : a), []);
    const step = clampStepIndex(current.step, stepIdx.length);
    const curLine = stepIdx[step];
    const progress = progressTitle(step, stepIdx.length);
    titleEl.innerHTML = buildTitleTextHtml(buildName) +
      (stepIdx.length ? `<span id="step-count" title="${esc(stepCountTitle(step, stepIdx.length))}">${step + 1}/${stepIdx.length}</span>` : '');
    if (!stepIdx.length) {
      notesEl.innerHTML = `<div class="txt-cur" title="${esc(`${buildName} has no non-empty text lines`)}">No usable build steps found</div>`;
      return;
    }
    progEl.style.display = '';
    progEl.title = `Build order progress - ${progress}`;
    progEl.style.setProperty('--seg', stepIdx.length > 40 ? '200%' : (100 / stepIdx.length) + '%');
    progEl.firstElementChild.style.width = ((step + 1) / stepIdx.length * 100) + '%';
    notesEl.title = `Current step - ${progress}`;
    notesEl.innerHTML = plainTextWindowHtml(lines, stepIdx, step);
    const nxLine = lines[stepIdx[step + 1]];
    if ((settings?.bo_show_next ?? true) && nxLine) {
      nextEl.style.display = '';
      nextEl.classList.remove('done');
      nextEl.title = nextTitle(step, stepIdx.length);
      nextEl.innerHTML = `<span class="nx-label">Next</span><div class="nx-note" title="${esc(`Next instruction: ${fallbackLineTitle(nxLine)}`)}">${fallbackLineHtml(nxLine)}</div>`;
    } else if ((settings?.bo_show_next ?? true) && step === stepIdx.length - 1) {
      nextEl.style.display = '';
      nextEl.classList.add('done');
      nextEl.title = `Build order complete - ${progress}`;
      nextEl.innerHTML = '<span class="nx-label">Done</span><div class="nx-done">Final step</div>';
    }
    restartStepAnimation(notesEl, nextEl);
  }
}

listen('bo_data', e => {
  const switched = current && e.payload && buildNameForDisplay(current) !== buildNameForDisplay(e.payload);
  current = e.payload;
  render();
  if (switched) {
    const p = document.getElementById('panel');
    p.classList.remove('bo-switch'); void p.offsetWidth; p.classList.add('bo-switch');
  }
});
listen('settings_changed', e => { settings = e.payload; applyStyle(); render(); });
listen('edit_mode', e => {
  if (e.payload.window === 'buildorder') document.body.classList.toggle('edit', !!e.payload.edit);
});
invoke('get_settings').then(s => { settings = s; applyStyle(); render(); });
invoke('get_bo').then(b => { if (b && !current) { current = b; render(); } });
</script>
</body>
</html>
